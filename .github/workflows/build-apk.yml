name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Restore pubspec.yaml
        run: git checkout -- pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Fix Android SDK and JVM Compatibility
        run: |
          # Purani values ko nayi values se replace kar rahe hain (naya block add nahi kar rahe)
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts
          sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' android/app/build.gradle.kts
          sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' android/app/build.gradle.kts
          sed -i 's/jvmTarget = "11"/jvmTarget = "17"/g' android/app/build.gradle.kts

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-free-shows-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
