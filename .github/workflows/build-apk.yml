
name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Restore pubspec.yaml
        run: git checkout -- pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure Android SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Set compileSdk for all Android plugins
        run: |
          cat <<'EOF' >> android/build.gradle.kts

          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileSdk = 36
                  }
              }

              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileSdk = 36
                  }
              }
          }
          EOF

      - name: Configure Kotlin JVM validation
        run: |
          touch android/gradle.properties
          if ! grep -q '^kotlin.jvm.target.validation.mode=' android/gradle.properties; then
            echo 'kotlin.jvm.target.validation.mode=warning' >> android/gradle.properties
          fi

      - name: Verify Android SDK configuration
        run: |
          echo "Java version:"
          java -version
          echo "App compileSdk:"
          grep -n 'compileSdk' android/app/build.gradle.kts
          echo "Plugin compileSdk override:"
          tail -n 20 android/build.gradle.kts

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-free-shows-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
