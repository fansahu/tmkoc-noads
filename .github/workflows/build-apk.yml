
name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android folder
        run: flutter create --platforms=android .

      - name: Restore pubspec.yaml
        run: git checkout -- pubspec.yaml

      - name: Flutter pub get
        run: flutter pub get

      - name: Configure Android SDK
        run: |
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' android/app/build.gradle.kts
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Fix Java and Kotlin JVM Targets
        run: |
          cat << 'EOF' >> android/build.gradle.kts

          // Configure Java 17 for all Android modules
          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.api.dsl.ApplicationExtension> {
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }

              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.api.dsl.LibraryExtension> {
                      compileOptions {
                          sourceCompatibility = JavaVersion.VERSION_17
                          targetCompatibility = JavaVersion.VERSION_17
                      }
                  }
              }

              // Configure Kotlin JVM 17
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          EOF

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ad-free-shows-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk

