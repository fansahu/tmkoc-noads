
name: Build Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android .

      - name: Restore original pubspec
        run: git checkout -- pubspec.yaml

      - name: Remove generated default test
        run: rm -rf test

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sed -i \
            's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
            android/app/build.gradle.kts

          sed -i \
            's/minSdk = flutter.minSdkVersion/minSdk = 24/' \
            android/app/build.gradle.kts

      - name: Configure compileSdk for Android plugins
        shell: bash
        run: |
          set -euo pipefail

          cat >> android/build.gradle.kts <<'EOF'

          subprojects {
              afterEvaluate {
                  val androidExtension = extensions.findByName("android")

                  if (androidExtension != null) {
                      val setter = androidExtension.javaClass.methods.firstOrNull {
                          it.name == "setCompileSdk" &&
                          it.parameterTypes.size == 1 &&
                          it.parameterTypes[0] == Int::class.javaPrimitiveType
                      }

                      setter?.invoke(androidExtension, 36)
                  }
              }
          }
          EOF

      - name: Configure Kotlin JVM validation
        run: |
          touch android/gradle.properties

          if ! grep -q '^kotlin.jvm.target.validation.mode=' android/gradle.properties; then
            echo 'kotlin.jvm.target.validation.mode=warning' >> android/gradle.properties
          fi

      - name: Verify environment
        run: |
          java -version
          flutter --version
          echo "Android app configuration:"
          grep -nE 'compileSdk|minSdk' android/app/build.gradle.kts

      - name: Analyze application code
        run: flutter analyze lib

      - name: Build debug APK
        run: flutter build apk --debug --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tmkoc-noads-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
          
